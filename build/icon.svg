<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    The Orbit application icon.

    Source of truth for build/icon.png, which electron-builder turns into the
    .icns and .ico it needs. Regenerate with: npm run icon
  -->
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#1c2b4a"/>
      <stop offset="55%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="planet" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#eff5fe"/>
      <stop offset="58%" stop-color="#c2d4ee"/>
      <stop offset="100%" stop-color="#6d8fc6"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16213c"/>
      <stop offset="22%" stop-color="#3f5f9c"/>
      <stop offset="46%" stop-color="#c2d4ee"/>
      <stop offset="68%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8fabd8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <g transform="translate(512 512) scale(3.05)">
    <circle r="72" fill="none" stroke="url(#planet)" stroke-width="13"/>
    <g transform="rotate(-20)">
      <ellipse rx="124" ry="33" fill="none" stroke="url(#band)" stroke-width="13"/>
    </g>
  </g>
</svg>
